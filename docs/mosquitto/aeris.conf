# Mosquitto listener for AERIS (LAN only, password protected).
#
# Install:
#   sudo cp docs/mosquitto/aeris.conf /etc/mosquitto/conf.d/aeris.conf
#   sudo mosquitto_passwd -c /etc/mosquitto/aeris_passwd aeris     # pick a password
#   sudo chown mosquitto: /etc/mosquitto/aeris_passwd && sudo chmod 640 /etc/mosquitto/aeris_passwd
#   sudo systemctl restart mosquitto
#
# Put the same user/password in config.yaml and firmware/esp8266/aeris_esp8266/config.h.
# Do not forward port 1883 to the internet.

listener 1883
allow_anonymous false
password_file /etc/mosquitto/aeris_passwd
